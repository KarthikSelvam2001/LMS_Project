kind = "web"
previewPath = "/"
title = "LMS Portal"
version = "1.0.0"
id = "artifacts/lms-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18628
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/lms-frontend run dev"

[services.env]
PORT = "18628"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/lms-frontend", "run", "build"]
publicDir = "artifacts/lms-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
