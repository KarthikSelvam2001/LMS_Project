<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LMS Portal</title>
    <script>
      // Fallback for SPA routing: Redirect to root and let the app handle the path
      const currentPath = window.location.pathname;
      window.location.href = "/?redirect=" + encodeURIComponent(currentPath);
    </script>
  </head>
  <body>
    <div id="root">Redirecting...</div>
  </body>
</html>
