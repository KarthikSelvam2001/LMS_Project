services:
  # Backend API Server
  - type: web
    name: lms-api-server
    env: node
    plan: free
    rootDir: artifacts/api-server
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.cjs
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production

  # Frontend Application
  - type: web
    name: lms-frontend
    env: static
    plan: free
    rootDir: artifacts/lms-frontend
    buildCommand: pnpm install && pnpm run build
    publishDir: dist/public
    envVars:
      - key: VITE_API_URL
        value: https://lms-api-server.onrender.com/api # Replace with your actual backend URL

