services:
  # Backend API Server
  - type: web
    name: lms-api-server
    env: node
    plan: free
    rootDir: artifacts/api-server
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/index.cjs
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://lms-project-h9a8.onrender.com

  # Frontend Application
  - type: static_site
    name: lms-frontend
    plan: free
    rootDir: artifacts/lms-frontend
    buildCommand: pnpm install && pnpm run build
    publishDir: dist/public
    envVars:
      - key: VITE_API_URL
        value: https://lms-project-be-hbhd.onrender.com/api # Correct backend URL
